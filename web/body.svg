<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 720" fill="none">
<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a3348"/>
    <stop offset="1" stop-color="#251f33"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c9a5e0"/>
    <stop offset="1" stop-color="#e0b8d0"/>
  </linearGradient>
</defs>
<g stroke="url(#edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#skin)" opacity="0.96">
  <!-- 头 -->
  <path d="M150 30 Q176 32 178 62 Q179 82 168 96 Q160 106 150 106 Q140 106 132 96 Q121 82 122 62 Q124 32 150 30 Z"/>
  <!-- 脖子(粗一点,男性) -->
  <path d="M138 100 L138 124 Q150 132 162 124 L162 100"/>
  <!-- 斜方肌到肩 -->
  <path d="M138 118 Q120 122 96 138"/>
  <path d="M162 118 Q180 122 204 138"/>
  <!-- 躯干:宽肩(96-204)→收窄的腰(120-180)→胯 -->
  <path d="M96 138 Q78 150 74 176 L84 210
           Q92 236 100 250 L108 290
           Q112 316 116 340 L120 396
           Q118 420 128 440 L172 440
           Q182 420 180 396 L184 340
           Q188 316 192 290 L200 250
           Q208 236 216 210 L226 176
           Q222 150 204 138
           Q188 152 178 172 L166 200 Q150 208 134 200 L122 172 Q112 152 96 138 Z"/>
  <!-- 左臂:三角肌→肱二头→前臂,有肌肉起伏 -->
  <path d="M78 148 Q56 168 50 202 Q46 238 52 274 Q56 306 66 332 L80 328
           Q72 302 70 272 Q69 240 76 210 Q82 180 94 160"/>
  <!-- 右臂 -->
  <path d="M222 148 Q244 168 250 202 Q254 238 248 274 Q244 306 234 332 L220 328
           Q228 302 230 272 Q231 240 224 210 Q218 180 206 160"/>
  <!-- 左腿:大腿→膝→小腿 -->
  <path d="M128 440 Q120 448 118 480 L114 546 Q112 592 120 636 Q124 668 132 700 L150 700
           Q152 664 150 620 L150 480 Q150 456 148 442"/>
  <!-- 右腿 -->
  <path d="M172 440 Q180 448 182 480 L186 546 Q188 592 180 636 Q176 668 168 700 L150 700
           Q148 664 150 620 L150 480"/>
</g>
<!-- 肌肉线条(非交互,暗示胸肌/腹肌/人鱼线) -->
<g stroke="url(#edge)" stroke-width="0.8" opacity="0.42" fill="none" stroke-linecap="round">
  <path d="M112 158 Q150 168 188 158"/>       <!-- 锁骨 -->
  <path d="M150 150 L150 250"/>                <!-- 胸骨中线 -->
  <path d="M116 196 Q135 210 150 208"/>        <!-- 左胸下缘 -->
  <path d="M184 196 Q165 210 150 208"/>        <!-- 右胸下缘 -->
  <path d="M126 262 Q150 270 174 262"/>        <!-- 腹肌1 -->
  <path d="M128 296 Q150 302 172 296"/>        <!-- 腹肌2 -->
  <path d="M130 330 Q150 336 170 330"/>        <!-- 腹肌3 -->
  <path d="M120 366 Q135 392 150 400"/>        <!-- 左人鱼线 -->
  <path d="M180 366 Q165 392 150 400"/>        <!-- 右人鱼线 -->
</g>
</svg>
